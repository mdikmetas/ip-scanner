name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "IP Tarayici" ip_scanner.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "IP Tarayici" ip_scanner.py
          ditto -c -k --keepParent "dist/IP Tarayici.app" "dist/IP-Tarayici-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ip-tarayici-${{ runner.os }}
          path: |
            dist/IP Tarayici.exe
            dist/IP-Tarayici-mac.zip
          if-no-files-found: ignore
